name: Windows EXE build and browser installer tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check PATCH increase on source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $current = (Get-Content -Raw -LiteralPath 'VERSION').Trim()
          if ($current -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$') {
            throw "Invalid VERSION: $current"
          }
          $parent = git rev-parse 'HEAD^' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $changed = @(git diff --name-only HEAD^ HEAD)
            $meaningful = @($changed | Where-Object { $_ -match '^(.*\.go|.*\.ps1|.*\.bat)$' })
            $versionChanged = $changed -contains 'VERSION'
            if ($meaningful.Count -gt 0 -and -not $versionChanged) {
              # A release may need several commits before publication. Once a
              # version is tagged, runtime changes must use the next PATCH.
              $publishedTag = @(git tag --list $current)
              if ($publishedTag.Count -gt 0) {
                throw 'Published executable or installer changed without a VERSION patch bump.'
              }
              Write-Host "Completing unpublished release $current; publish workflow checks the next PATCH."
            }
            if ($versionChanged) {
              $previous = git show 'HEAD^:VERSION' 2>$null
              if ($LASTEXITCODE -eq 0) {
                $old = [regex]::Match($previous.Trim(), '^v([0-9]+)\.([0-9]+)\.([0-9]+)(?:-rc\.[0-9]+)?$')
                $next = [regex]::Match($current, '^v([0-9]+)\.([0-9]+)\.([0-9]+)(?:-rc\.[0-9]+)?$')
                if ($old.Success -and $next.Success) {
                  if ($old.Groups[1].Value -ne $next.Groups[1].Value -or $old.Groups[2].Value -ne $next.Groups[2].Value -or [int]$next.Groups[3].Value -ne ([int]$old.Groups[3].Value + 1)) {
                    throw 'PATCH must increase by exactly 1 while MAJOR/MINOR stay unchanged.'
                  }
                }
              }
            }
          }
      - name: Go tests
        run: go test -count=1 ./...
      - name: Validate real order name extraction JavaScript (HU RO SK CZ EN)
        shell: pwsh
        run: node tests/order_name_cases.js
      - name: Build Windows GUI EXE
        shell: pwsh
        run: go build -trimpath -ldflags '-H windowsgui -s -w' -o 'name - number copy.exe' .
      - name: Browser discovery, login autostart, installer integration tests
        shell: pwsh
        run: ./tests/test_installer_windows.ps1
      - name: Verify real signed Brave with its normal profile on disposable worker
        shell: pwsh
        run: ./tests/test_real_brave_windows.ps1
      - name: Upload standalone EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: name-number-copy-windows
          path: name - number copy.exe
          if-no-files-found: error
