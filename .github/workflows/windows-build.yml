name: Windows EXE build and tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go tests
        run: go test -count=1 ./...
      - name: Build Windows GUI EXE
        shell: pwsh
        run: go build -trimpath -ldflags '-H windowsgui -s -w' -o 'name - number copy.exe' .
      - name: Verify user-selected installation path (Windows cmd)
        shell: pwsh
        run: ./tests/test_installer_windows.ps1
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: name-number-copy-windows
          path: name - number copy.exe
          if-no-files-found: error