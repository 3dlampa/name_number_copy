name: Publish standalone EXE and full ZIP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        shell: pwsh
        run: go test -count=1 ./...
      - name: Build Windows standalone GUI EXE
        shell: pwsh
        run: go build -trimpath -ldflags '-H windowsgui -s -w' -o 'name - number copy.exe' .
      - name: Test Windows installer
        shell: pwsh
        run: ./tests/test_installer_windows.ps1
      - name: Create and verify complete ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'package'
          $src = Join-Path $root 'source'
          $ci = Join-Path $src '.github/workflows'
          $testDir = Join-Path $src 'tests'
          New-Item -ItemType Directory -Force -Path $ci, $testDir | Out-Null
          Copy-Item -LiteralPath 'name - number copy.exe', 'telepites.bat' -Destination $root
          foreach ($f in @('README.md', 'CHANGELOG.md', 'go.mod', 'main.go', 'main_test.go', 'platform_windows.go', 'platform_other.go', '.gitignore')) {
            Copy-Item -LiteralPath $f -Destination $src
          }
          Copy-Item -LiteralPath 'tests/test_installer_windows.ps1' -Destination $testDir
          Copy-Item -LiteralPath '.github/workflows/windows-build.yml', '.github/workflows/publish-release.yml' -Destination $ci
          $archive = 'name_number_copy_choice_fix_20261012.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $archive -CompressionLevel Optimal -Force
          Expand-Archive -LiteralPath $archive -DestinationPath 'release-verify' -Force
          $exeName = 'name - number copy.exe'
          foreach ($path in @("release-verify/$exeName", 'release-verify/telepites.bat', 'release-verify/source/main.go', 'release-verify/source/README.md')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "ZIP missing file: $path" }
          }
          if ((Get-FileHash -LiteralPath $exeName -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath "release-verify/$exeName" -Algorithm SHA256).Hash) {
            throw 'EXE in ZIP differs from standalone EXE'
          }
          $bat = [IO.File]::ReadAllText((Resolve-Path -LiteralPath 'release-verify/telepites.bat'))
          if ($bat -match '(?<!\r)\n') { throw 'Installer BAT contains non-CRLF line endings' }
          Write-Host 'Release EXE and complete ZIP validated.'
          Get-FileHash -Algorithm SHA256 -LiteralPath $exeName, $archive | Format-Table -AutoSize
      - name: Publish both files to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.3'
          $zip = 'name_number_copy_choice_fix_20261012.zip'
          $exe = 'name - number copy.exe'
          $notes = @'
          ## Név és rendelésszám másoló, v1.0.3 (2026-10-12)

          **Két letöltés:** közvetlenül futtatható standalone Windows x64 EXE; teljes ZIP (EXE + telepítő BAT + forráskód + tesztek + dokumentáció).

          - Egy egyedi rendelésnél rejtett futás és vágólapra másolás, fókuszelvétel nélkül.
          - Több különböző rendelésnél csak a választás idejére megnyíló számozott konzol. 1-9 billentyű Enter nélkül, Esc megszakít.
          - A vágólapra másolt adatok előtt HU / RO / SK / CZ országkód; SOS formátum megőrizve.
          - A telepítő bekéri a célmappát. Az alapértelmezett hely: D:\3d lámpa\Photoshop és Illustrator scriptek. Felülírás előtt mentés.
          - Windows Actions tesztelt build; az Illustrator fókuszkezelése éles Windows-gépen még visszaellenőrizendő.
          '@
          Set-Content -LiteralPath 'release-notes.md' -Value $notes -Encoding utf8
          $releases = @(gh release list --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read existing releases' }
          if ($releases.tagName -contains $tag) {
            gh release upload $tag $exe $zip --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update release files' }
          } else {
            gh release create $tag $exe $zip --title 'Név és rendelésszám másoló v1.0.3' --notes-file 'release-notes.md' --target $env:GITHUB_SHA --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub Release' }
          }
          gh release view $tag --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify published assets' }
