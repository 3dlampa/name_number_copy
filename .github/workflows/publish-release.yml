name: Publish version-matched standalone EXE and full installer ZIP

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
    inputs:
      stable:
        description: 'Stable only after user has verified actual operation'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify VERSION and PATCH increment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_STABLE: ${{ inputs.stable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = (Get-Content -Raw -LiteralPath VERSION).Trim()
          $m = [regex]::Match($tag, '^v([0-9]+)\.([0-9]+)\.([0-9]+)(?:-rc\.([0-9]+))?$')
          if (-not $m.Success) { throw "Invalid VERSION: $tag" }
          if ($env:REQUESTED_STABLE -eq 'true' -and $tag.Contains('-rc.')) {
            throw 'An RC build cannot be promoted as stable: increment PATCH and remove RC in VERSION.'
          }
          $oldReleases = @(gh release list --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read existing GitHub releases' }
          if (@($oldReleases | Where-Object tagName -EQ $tag).Count -ne 0) {
            throw "Release $tag already exists; never overwrite an earlier backup."
          }
          $major = [int]$m.Groups[1].Value
          $minor = [int]$m.Groups[2].Value
          $patch = [int]$m.Groups[3].Value
          $previousPatches = @()
          foreach ($old in $oldReleases) {
            $match = [regex]::Match([string]$old.tagName, '^v([0-9]+)\.([0-9]+)\.([0-9]+)(?:-rc\.[0-9]+)?$')
            if ($match.Success -and [int]$match.Groups[1].Value -eq $major -and [int]$match.Groups[2].Value -eq $minor) {
              $previousPatches += [int]$match.Groups[3].Value
            }
          }
          if ($previousPatches.Count -gt 0) {
            $expected = ($previousPatches | Measure-Object -Maximum).Maximum + 1
            if ($patch -ne $expected) {
              throw "PATCH must increment by exactly 1: expected v$major.$minor.$expected, got $tag"
            }
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_ZIP=name_number_copy_full_$tag.zip" >> $env:GITHUB_ENV
          Write-Host "Checked release version: $tag"
      - name: Verify all Go tests including embedded version
        shell: pwsh
        run: go test -count=1 ./...
      - name: Validate real order name extraction JavaScript (HU RO SK CZ EN)
        shell: pwsh
        run: node tests/order_name_cases.js
      - name: Build standalone Windows GUI EXE
        shell: pwsh
        run: go build -trimpath -ldflags '-H windowsgui -s -w' -o 'name - number copy.exe' .
      - name: Test browser setup, Windows installer and uninstall BAT
        shell: pwsh
        run: ./tests/test_installer_windows.ps1
      - name: Verify real signed Brave with its normal profile on disposable worker
        shell: pwsh
        run: ./tests/test_real_brave_windows.ps1
      - name: Assemble and verify full ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'package/source/.github/workflows', 'package/source/tests' | Out-Null
          foreach ($f in @('name - number copy.exe','telepites.bat','elevate_installer.ps1','setup_browser.ps1','start_opencart_browser.ps1','installer_common.ps1','uninstall.ps1','eltavolitas.bat','HASZNALATI_FELTETELEK.txt','README.md','VERSION')) {
            Copy-Item -LiteralPath $f -Destination 'package'
          }
          # Include every tracked source/test/doc file so new runtime files cannot be omitted.
          foreach ($f in @(git ls-files)) {
            $target = Join-Path 'package/source' $f
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            Copy-Item -LiteralPath $f -Destination $target
          }
          Compress-Archive -Path 'package/*' -DestinationPath $env:RELEASE_ZIP -CompressionLevel Optimal -Force
          Expand-Archive -LiteralPath $env:RELEASE_ZIP -DestinationPath 'release-verify' -Force
          foreach ($f in @('name - number copy.exe','telepites.bat','elevate_installer.ps1','setup_browser.ps1','start_opencart_browser.ps1','VERSION','source/main.go','source/elevate_installer.ps1','source/tests/test_installer_elevation.ps1','source/README.md','source/VERSION','source/version_test.go','source/cdp_fragment_test.go','source/tests/order_name_cases.js','source/docs/verification-v1.1.12.md','installer_common.ps1','uninstall.ps1','eltavolitas.bat','HASZNALATI_FELTETELEK.txt','source/browser_launcher.go','source/browser_windows.go','source/browser_other.go','source/browser_launcher_test.go','source/tests/test_installer_consent_uninstall.ps1','source/tests/installer_test_helpers.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release-verify' $f) -PathType Leaf)) { throw "ZIP missing $f" }
          }
          $zipTag = (Get-Content -Raw 'release-verify/VERSION').Trim()
          $sourceTag = (Get-Content -Raw 'release-verify/source/VERSION').Trim()
          if ($zipTag -ne $env:RELEASE_TAG -or $sourceTag -ne $env:RELEASE_TAG) { throw 'EXE source and ZIP versions mismatch' }
          if ((Get-FileHash -LiteralPath 'name - number copy.exe' -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath 'release-verify/name - number copy.exe' -Algorithm SHA256).Hash) { throw 'Standalone EXE and ZIP EXE hashes differ' }
          $bat = [IO.File]::ReadAllText((Resolve-Path 'release-verify/telepites.bat'))
          if ($bat -match '(?<!\r)\n') { throw 'Installer BAT has non-Windows newlines' }
          Write-Host "Version-matched EXE, ZIP and installer verified: $env:RELEASE_TAG"
      - name: Upload version-matched EXE and full ZIP as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: name-number-copy-package-${{ github.run_number }}
          path: |
            name - number copy.exe
            name_number_copy_full_*.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable Release with matching version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_STABLE: ${{ inputs.stable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $zip = $env:RELEASE_ZIP
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing overwrite." }
          $notes = @"
          ## Név és rendelésszám másoló $tag

          - A program, VERSION, Release tag és a teljes ZIP verziója azonos: $tag
          - Standalone Windows EXE és teljes telepítő ZIP, a forrással és tesztekkel.
          - Alapértelmezett célmappa C:\Scripts, Enterrel elfogadható és továbbra is módosítható.
          - Választható normál Brave-profil a meglévő belépésekkel, tényleges eredeti profilmappából; nincs sütimásolás vagy munkamenet-hamisítás. A külön OpenCart-profil továbbra is választható, Chrome/Edge változatlan.
          - A normál Brave-profil helyi CDP-hozzáférése a normál profil lapjait is elérhetővé teszi helyi programoknak; a telepítő ezt előre jelzi. Google újraazonosítást továbbra is kérhet.
          - Első váltás előtt minden Brave-ablakot be kell zárni; az indító nem állít le böngészőt erővel. Normál profilhoz a saját indítás folyamatát és a port tulajdonosát ellenőrzi; a régi külön profilt nem használja helyette.
          - Telepítés előtti tájékoztatás és jóváhagyás, külön választható automatikus böngészőindítás (alapból kikapcsolva).
          - Natív EXE böngészőindító, közvetlen Asztal/Start menü/Startup ikonok; nincs PowerShell a szokásos böngészőindításban.
          - Olvasható, látható UAC -File emelés; csak az útvonaladat kódolt, nincs EncodedCommand. Közvetlen admin-telepítéskor látható, ideiglenes Limited/InteractiveToken feladat, végén törölve.
          - Saját eltávolító valódi BAT/UAC belépési teszttel: önmaga törlése után is helyes 0 kilépési kód. Használati/adatkezelési tájékoztató; más fájlok, parancsikonok és böngészőprofilok megőrzése.
          - Megmarad a backup nélküli frissítés és a régi saját backupok célzott törlése, a Brave/Chrome/Edge és régi profilok felismerése, a CDP-kapcsolat, a másolás, választó, fókuszvisszaadás, SOS és az utolsó kötőjel utáni szóköz.
          - Go-, JavaScript-, telepítő-, útvonal-, CDP-, beleegyezés- és eltávolítási regressziós tesztek; részletek a csomag source/docs/verification-v1.1.12.md fájljában.
          - Használat/adatkezelés: a csomag HASZNALATI_FELTETELEK.txt fájlja. Nincs telemetria vagy külső programletöltés.
          - A csomag nincs hiteles kiadói kódaláírással ellátva. A változtatások a Google átláthatósági és eltávolíthatósági elveit követik; a Drive elfogadása nem garantálható, korábbi tiltásának konkrét oka nem ismert.
          "@
          Set-Content -LiteralPath 'release-notes.md' -Value $notes -Encoding utf8
          $args = @('release','create',$tag,'name - number copy.exe',$zip,'--title',"Név és rendelésszám másoló $tag",'--notes-file','release-notes.md','--target','main')
          if ($tag -match '-rc\.[0-9]+$') { $args += '--prerelease' } else { $args += '--latest' }
          # The release must target the CURRENT default branch (not an outdated workflow commit).
          # GitHub blocks GITHUB_TOKEN release creation when target differs in .github/workflows.
          $branchHead = (gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve default branch head' }
          if ($branchHead -ne $env:GITHUB_SHA) {
            throw "Main advanced during build; refusing mismatched release. HEAD=$branchHead BUILT=$env:GITHUB_SHA"
          }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed: $tag" }
          $published = gh release view $tag --json url,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
          $assets = @($published.assets | ForEach-Object { $_.name })
          if ($assets.Count -ne 2 -or $assets -notcontains $zip -or @($assets | Where-Object { $_ -like '*.exe' }).Count -ne 1) {
            throw 'Release assets incomplete: standalone EXE and full ZIP are both required'
          }
          Write-Host "Released version $tag at $($published.url)"
